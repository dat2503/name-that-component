name: Bug report
description: Report incorrect detection or extension behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include what you expected Name That Component to report.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 1.3.0
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Page framework
      options: [Plain HTML, React, Vue, Angular, Astro, Other or unknown]
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Share a public URL or a minimal HTML example. Remove private page data.
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version and operating system
    validations:
      required: true
